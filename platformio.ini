; PlatformIO Project Configuration File
;
; Badminton-Watch: badminton hit counter for the LILYGO T-Watch-S3
; https://lilygo.cc/products/t-watch-s3
;
; Build options:
;   twatchs3       - default build, no LoRa
;   twatchs3-lora  - optional build with LoRa hit-count broadcasting

[platformio]
libdeps_dir = C:/pio-libdeps
packages_dir = C:/Users/Owner/.platformio/p
default_envs = twatchs3
boards_dir = ./boards

[env]
framework = arduino
platform = espressif32@7.1.3
platform_packages =
  framework-arduinoespressif32@3.20017.241212+sha.dcc1105b
extra_scripts = pre:support/patch_lilygo_lcd.py
board = lilygo-t-watch-s3
debug_speed = 1000
upload_port = COM4
monitor_port = COM4
upload_speed = 921600
monitor_speed = 115200
board_build.filesystem = fatfs
board_build.partitions = support/partitions.csv
build_flags =
    -D CORE_DEBUG_LEVEL=4
    -D ARDUINO_USB_CDC_ON_BOOT=1
    ; -U ARDUINO_USB_CDC_ON_BOOT        ; Disable Serial output
    -D RADIOLIB_EXCLUDE_RF69
    -D RADIOLIB_EXCLUDE_SX1231
    ; -D RADIOLIB_EXCLUDE_CC1101
    ; -D RADIOLIB_EXCLUDE_SI443X
    ; -D RADIOLIB_EXCLUDE_SX128X
    ; -D RADIOLIB_EXCLUDE_NRF24
    -D RADIOLIB_EXCLUDE_RFM2X
    -D RADIOLIB_EXCLUDE_SX127X
    ; -D RADIOLIB_EXCLUDE_STM32WLX
    -D RADIOLIB_EXCLUDE_AFSK
    -D RADIOLIB_EXCLUDE_AX25
    -D RADIOLIB_EXCLUDE_HELLSCHREIBER
    -D RADIOLIB_EXCLUDE_MORSE
    -D RADIOLIB_EXCLUDE_RTTY
    -D RADIOLIB_EXCLUDE_SSTV
    -D RADIOLIB_EXCLUDE_DIRECT_RECEIVE
    -D RADIOLIB_EXCLUDE_APRS
    -D RADIOLIB_EXCLUDE_BELL
    -Wnarrowing
    ; LilyGoLib requires a radio module define to compile; the app-level
    ; LoRa chat feature is controlled separately by APP_LORA_CHAT below.
    -D ARDUINO_LILYGO_LORA_SX1262   ; Used SX1262 LoRa
    -D ARDUINO_T_WATCH_S3
    -I variants/lilygo_twatch_s3
monitor_filters =
    default
    esp32_exception_decoder
lib_deps =
    xinyuan-lilygo/LilyGoLib @ ^0.2.0
    lvgl/lvgl @ ^9.4.0
    jgromes/RadioLib @ ^7.4.0
    lewisxhe/XPowersLib@^0.3.1
    lewisxhe/SensorLib @ ^0.3.3
    mikalhart/TinyGPSPlus @ ^1.0.3
    https://github.com/lewisxhe/ESP32-BLE-Keyboard-fork.git
    https://github.com/lewisxhe/ESP32-BLE-Mouse-fork.git
    earlephilhower/ESP8266Audio @ 2.0.0
    ESP32 BLE Arduino
    h2zero/NimBLE-Arduino @ ^2.2.3
    https://github.com/tonhuisman/IRremoteESP8266/archive/refs/heads/feature/C++20-compatibility.zip

[env:twatchs3]
build_flags =
    ${env.build_flags}

[env:twatchs3-lora]
build_flags =
    ${env.build_flags}
    -D APP_LORA_CHAT=1
    -D RADIO_FIXED_FREQUENCY=915.0
    -D RADIO_FIXED_FREQUENCY_STRING=\"915MHz\"
